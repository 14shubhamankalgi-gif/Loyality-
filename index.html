<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avadhut Shankar Foods - Loyalty Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Avadhut Shankar Foods</h1>
        <div class="login-box">
            <h2>Customer Login</h2>
            <input type="text" id="custName" placeholder="Enter Name">
            <input type="tel" id="custPhone" placeholder="Enter Phone Number">
            <button onclick="loginCustomer()">Login as Customer</button>
        </div>

        <div class="login-box owner-box">
            <h2>Owner Login</h2>
            <input type="tel" id="ownerPhone" placeholder="Phone Number">
            <input type="password" id="ownerPass" placeholder="Password">
            <button onclick="loginOwner()">Login as Owner</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
